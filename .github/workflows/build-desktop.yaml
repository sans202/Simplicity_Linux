name: Build & Publish Desktop Apps

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Next.js & Electron
        run: yarn build:desktop

      - name: Build and Publish Electron App
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ github.event_name == 'release' }}
          # On macOS, if you don't have MAC_SIGN=1, disable/bypass developer ID
          mac_certs: ''
          max_attempts: 3
        env:
          # Standard env vars for electron-builder action
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
